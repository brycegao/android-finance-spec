name: CI

on:
  push:
  pull_request:

jobs:
  scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify bundled skill references are in sync
        run: |
          python3 scripts/sync_skill_refs.py
          git diff --exit-code -- skills/android-finance-spec/references

      - name: Run scanner regression tests
        run: python3 -m unittest tests/test_android_finance_scan.py
